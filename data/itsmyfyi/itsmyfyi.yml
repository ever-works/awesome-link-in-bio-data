markdown: >-
  ## Overview


  itsmy.fyi is an open-source alternative to Linktree that enables users to take
  control of their online presence by creating a personalized link-in-bio page
  hosted on their own infrastructure.


  ## Features


  - Self-hosted link-in-bio page

  - Open-source codebase

  - TypeScript implementation

  - Privacy-focused alternative to commercial link-in-bio services


  ## Deployment


  Self-hosted.


  ## License


  Open source.
