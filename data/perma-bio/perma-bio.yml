markdown: >-
  ## Overview


  Perma.bio is a closed-source link-in-bio SaaS with flat annual pricing. It
  offers an Evergreen plan at $18/year and a Pro plan at $39/year, both with 0%
  platform fees.


  ## Pricing Model


  Paid subscription with two tiers: Evergreen ($18/yr) and Pro ($39/yr). No
  platform fees on transactions.


  ## Deployment


  Cloud-hosted SaaS.
